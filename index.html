<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KarlBot App</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4208CC">

<style>
body{font-family:Arial;margin:0;background:#f5f5f5;}
header{background:#4208CC;color:#fff;padding:15px;text-align:center;}
#chat{height:300px;overflow-y:auto;background:#fff;padding:10px;}
.msg{margin:5px;padding:8px;border-radius:10px;}
.user{background:#FC8F00;color:#fff;text-align:right;}
.bot{background:#eee;}
input{width:80%;padding:10px;}
button{padding:10px;background:#4208CC;color:#fff;border:none;}
</style>
</head>

<body>

<header><h2>KarlBot</h2></header>

<div id="chat"></div>
<input id="q" placeholder="Type here...">
<button onclick="ask()">Send</button>

<script>

let stock={
"mugs":50,
"stanley":30,
"notebooks":100
};

function saveStock(){
 localStorage.setItem("stock",JSON.stringify(stock));
}
function loadStock(){
 let s=localStorage.getItem("stock");
 if(s){stock=JSON.parse(s);}
}

function msg(t,type){
 let d=document.createElement("div");
 d.className="msg "+type;
 d.innerText=t;
 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;
}

function findItem(text){
 for(let i in stock){
  if(text.includes(i)) return i;
 }
 return null;
}

function ask(){
 let input=q.value.trim();
 if(!input)return;

 q.value="";
 msg(input,"user");

 let lower=input.toLowerCase();
 let reply="";

 if(lower.includes("sold")){
  let n=parseInt(lower.match(/\d+/));
  let item=findItem(lower);
  if(item){
   stock[item]-=n;
   saveStock();
   reply=`Sold ${n} ${item}. Remaining: ${stock[item]}`;
  }else reply="Item not found";
 }

 else if(lower.includes("add")){
  let n=parseInt(lower.match(/\d+/));
  let item=findItem(lower);
  if(item){
   stock[item]+=n;
   saveStock();
   reply=`Added ${n} ${item}. Total: ${stock[item]}`;
  }else reply="Item not found";
 }

 else if(lower.includes("today")){
  reply=new Date().toDateString();
 }

 else{
  let item=findItem(lower);
  if(item){
   reply=`${item}: ${stock[item]}`;
  }else{
   reply="Try: sold 2 mugs, add 5 notebooks";
  }
 }

 setTimeout(()=>msg(reply,"bot"),300);
}

window.onload=loadStock;

if('serviceWorker' in navigator){
 navigator.serviceWorker.register('sw.js');
}

</script>

</body>
</html>
