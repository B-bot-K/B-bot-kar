<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brandit System</title>

<style>
body{font-family:Arial;margin:0;background:#f5f5f5;}
header{background:#4208CC;color:#fff;padding:15px;text-align:center;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;}
.card{background:#fff;padding:20px;text-align:center;border-radius:10px;cursor:pointer;}
.section{display:none;padding:10px;}
.active{display:block;}
button{background:#FC8F00;border:none;padding:10px;color:#fff;border-radius:5px;margin:5px;}
input{padding:10px;width:90%;margin:5px;}
#chat{height:300px;overflow-y:auto;background:#fff;padding:10px;border-radius:10px;}
.msg{margin:5px;padding:8px;border-radius:10px;}
.user{background:#FC8F00;color:#fff;text-align:right;}
.bot{background:#eee;}
table{width:100%;border-collapse:collapse;margin-top:10px;}
td,th{border:1px solid #ccc;padding:6px;text-align:center;}
</style>

</head>

<body>

<header><h2>Brandit System</h2></header>

<!-- DASHBOARD -->

<div id="dashboard" class="active">
  <div class="grid">
    <div class="card" onclick="openSection('work')">📊 Work</div>
    <div class="card" onclick="openSection('ai')">🤖 Smart Bot</div>
  </div>
</div>

<!-- WORK -->

<div id="work" class="section">
  <select id="day">
    <option>Monday</option><option>Tuesday</option>
    <option>Wednesday</option><option>Thursday</option>
    <option>Friday</option><option>Saturday</option>
  </select>
  <button onclick="addRow()">Add Job</button>
  <div id="tables"></div>
  <button onclick="goBack()">Back</button>
</div>

<!-- AI -->

<div id="ai" class="section">
  <div id="chat"></div>
  <input id="q" placeholder="Talk to Brandit Assistant...">
  <button onclick="ask()">Send</button>
  <button onclick="goBack()">Back</button>
</div>

<script>

// ===== NAV =====
function openSection(id){
 document.querySelectorAll('.section,#dashboard').forEach(e=>e.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}
function goBack(){
 document.querySelectorAll('.section').forEach(e=>e.classList.remove('active'));
 document.getElementById('dashboard').classList.add('active');
}

// ===== WORK =====
function saveWork(){ localStorage.setItem("tables",tables.innerHTML); }
function loadWork(){ if(localStorage.tables){ tables.innerHTML=localStorage.tables; } }

function addRow(){
 let day=document.getElementById("day").value;

 if(!document.getElementById(day)){
  tables.innerHTML+=`
  <div id="${day}">
  <h4>${day}</h4>
  <table>
  <tr>
  <th>Job</th><th>Description</th><th>Price</th>
  <th>Paid</th><th>Balance</th><th>Unpaid</th>
  </tr>
  <tbody></tbody></table></div>`;
 }

 let t=document.querySelector(`#${day} tbody`);
 let r=document.createElement("tr");

 r.innerHTML=`
 <td contenteditable></td>
 <td contenteditable></td>
 <td contenteditable oninput="calc(this)"></td>
 <td contenteditable oninput="calc(this)"></td>
 <td></td><td></td>
 `;

 r.oninput=saveWork;
 t.appendChild(r);
}

function calc(c){
 let r=c.parentElement;
 let p=Number(r.cells[2].innerText)||0;
 let paid=Number(r.cells[3].innerText)||0;
 let bal=p-paid;
 r.cells[4].innerText=bal;
 r.cells[5].innerText=bal>0?bal:0;
 saveWork();
}

// ===== STOCK =====
let stock={mugs:50,stanley:30,notebooks:100,wristbands:5000};
let history=[];
let lastItem=null;

// ===== STORAGE =====
function saveAll(){
 localStorage.setItem("stock",JSON.stringify(stock));
 localStorage.setItem("history",JSON.stringify(history));
}
function loadAll(){
 let s=localStorage.getItem("stock");
 if(s) stock=JSON.parse(s);
 let h=localStorage.getItem("history");
 if(h) history=JSON.parse(h);
}

// ===== UI =====
function msg(t,type){
 let d=document.createElement("div");
 d.className="msg "+type;
 d.innerText=t;
 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;
}

// ===== HELPERS =====
function normalize(t){
 t=t.toLowerCase();
 let map={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};
 for(let w in map){
  t=t.replace(new RegExp("\\b"+w+"\\b","g"),map[w]);
 }
 return t;
}

function getDate(type){
 let d=new Date();
 if(type==="today") return d.toDateString();
 if(type==="tomorrow"){d.setDate(d.getDate()+1); return d.toDateString();}
 if(type==="yesterday"){d.setDate(d.getDate()-1); return d.toDateString();}
}

function findItem(t){
 for(let i in stock){
  if(t.includes(i) || t.includes(i.slice(0,-1))){
   return i;
  }
 }
 return lastItem;
}

// ===== MAIN AI =====
function ask(){

 let input=q.value.trim();
 if(!input)return;

 q.value="";
 msg(input,"user");

 let t=normalize(input);
 let qty=(t.match(/\d+/)||[0])[0];
 qty=qty?parseInt(qty):null;
 let item=findItem(t);

 let reply="";

// GREET
 if(t.match(/hi|hello|hey|good morning|good evening/)){
  reply="Hey 👋 Welcome to Brandit! How can I help you today?";
 }

// DATE
 else if(t.includes("today")){
  reply=`📅 Today is ${getDate("today")}`;
 }
 else if(t.includes("tomorrow")){
  reply=`📅 Tomorrow is ${getDate("tomorrow")}`;
 }
 else if(t.includes("yesterday")){
  reply=`📅 Yesterday was ${getDate("yesterday")}`;
 }

// TIME
 else if(t.includes("time")){
  reply=`⏰ Current time: ${new Date().toLocaleTimeString()}`;
 }

// CASUAL
 else if(t.includes("how are you")){
  reply="😊 I'm doing great! Ready to help your business.";
 }
 else if(t.includes("your name")){
  reply="I'm Brandit Assistant 🤖";
 }
 else if(t.includes("what can you do")){
  reply="I track stock, record sales, give reports and suggestions 📊";
 }

// SELL
 else if(t.match(/sell|sold|gave/)){
  if(!item) reply="Which item did you sell?";
  else if(!qty) reply=`How many ${item}?`;
  else{
   stock[item]-=qty;
   history.push({type:"sale",item,qty});
   lastItem=item;
   saveAll();
   reply=`✅ Sold ${qty} ${item}. Remaining: ${stock[item]}`;
  }
 }

// ADD
 else if(t.match(/add|restock|bought/)){
  if(!item) reply="Which item are you adding?";
  else if(!qty) reply=`How many ${item}?`;
  else{
   stock[item]+=qty;
   history.push({type:"add",item,qty});
   lastItem=item;
   saveAll();
   reply=`📦 Added ${qty} ${item}. Total: ${stock[item]}`;
  }
 }

// REPORT
 else if(t.includes("report") || t.includes("sales")){
  let total=history.filter(h=>h.type==="sale").reduce((a,b)=>a+b.qty,0);
  reply=`📊 Total sold: ${total}`;
 }

// LOW
 else if(t.includes("low") || t.includes("running out")){
  let low=Object.keys(stock).filter(i=>stock[i]<10);
  reply=low.length?`⚠️ Low stock: ${low.join(", ")}`:"Stock levels are okay";
 }

// SUGGEST
 else if(t.includes("suggest") || t.includes("restock")){
  let s=Object.entries(stock).sort((a,b)=>a[1]-b[1])[0];
  reply=`📦 You should restock ${s[0]} (${s[1]} left)`;
 }

// TOP
 else if(t.includes("best") || t.includes("top")){
  let count={};
  history.forEach(h=>{
   if(h.type==="sale"){
    count[h.item]=(count[h.item]||0)+h.qty;
   }
  });
  let top=Object.entries(count).sort((a,b)=>b[1]-a[1])[0];
  reply=top?`🔥 Best selling: ${top[0]}`:"No sales yet";
 }

// CHECK
 else if(item){
  reply=`📦 ${item}: ${stock[item]} left`;
 }

// FALLBACK
 else{
  reply="🤔 I didn’t fully understand, but I can answer questions, track stock, and help your business.";
 }

 msg(reply,"bot");
}

// INIT
window.onload=function(){
 loadWork();
 loadAll();
 msg("👋 Hi! I'm Brandit Assistant — ask me anything or manage your business 🚀","bot");
};

</script>

</body>
</html>
