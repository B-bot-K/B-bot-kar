<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Br Bot Pro System</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4208CC">

<style>
body{font-family:Arial;margin:0;background:#f5f5f5;}
header{background:#4208CC;color:#fff;padding:15px;text-align:center;}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;}
.card{background:#fff;padding:20px;text-align:center;border-radius:10px;cursor:pointer;}

.section{display:none;padding:10px;}
.active{display:block;}

button{background:#FC8F00;border:none;padding:10px;color:#fff;border-radius:5px;margin:5px;}
input{padding:10px;width:90%;margin:5px;}

#chat{height:300px;overflow-y:auto;background:#fff;padding:10px;border-radius:10px;}
.msg{margin:5px;padding:8px;border-radius:10px;}
.user{background:#FC8F00;color:#fff;text-align:right;}
.bot{background:#eee;}

table{width:100%;border-collapse:collapse;margin-top:10px;}
td,th{border:1px solid #ccc;padding:6px;text-align:center;}
</style>

</head>

<body>

<header>
<h2>Br Bot Pro System</h2>
</header>

<div id="dashboard" class="active">
  <div class="grid">
    <div class="card" onclick="openSection('work')">📊 Work</div>
    <div class="card" onclick="openSection('ai')">🤖 Br Bot</div>
  </div>
</div>

<!-- WORK -->

<div id="work" class="section">
  <select id="day">
    <option>Monday</option><option>Tuesday</option>
    <option>Wednesday</option><option>Thursday</option>
    <option>Friday</option><option>Saturday</option>
  </select>

<button onclick="addRow()">Add Job</button>

  <div id="tables"></div>
  <button onclick="goBack()">Back</button>
</div>

<!-- AI -->

<div id="ai" class="section">
  <div id="chat"></div>
  <input id="q" placeholder="Talk to Br Bot...">
  <button onclick="ask()">Send</button>
  <button onclick="goBack()">Back</button>
</div>

<script>

// NAV
function openSection(id){
 document.querySelectorAll('.section,#dashboard').forEach(e=>e.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}
function goBack(){
 document.querySelectorAll('.section').forEach(e=>e.classList.remove('active'));
 document.getElementById('dashboard').classList.add('active');
}

// WORK SYSTEM
function saveWork(){ localStorage.setItem("tables",tables.innerHTML); }
function loadWork(){ if(localStorage.tables){ tables.innerHTML=localStorage.tables; } }

function addRow(){
 let day=document.getElementById("day").value;

 if(!document.getElementById(day)){
  tables.innerHTML+=`
  <div id="${day}">
  <h4>${day}</h4>
  <table>
  <tr>
  <th>Job</th><th>Description</th><th>Price</th>
  <th>Paid</th><th>Balance</th><th>Unpaid</th>
  </tr>
  <tbody></tbody></table></div>`;
 }

 let t=document.querySelector(`#${day} tbody`);
 let r=document.createElement("tr");

 r.innerHTML=`
 <td contenteditable></td>
 <td contenteditable></td>
 <td contenteditable oninput="calc(this)"></td>
 <td contenteditable oninput="calc(this)"></td>
 <td></td><td></td>
 `;

 r.oninput=saveWork;
 t.appendChild(r);
}

function calc(c){
 let r=c.parentElement;
 let p=Number(r.cells[2].innerText)||0;
 let paid=Number(r.cells[3].innerText)||0;
 let bal=p-paid;
 r.cells[4].innerText=bal;
 r.cells[5].innerText=bal>0?bal:0;
 saveWork();
}

// STOCK
let stock={
 "mugs":50,
 "stanley":30,
 "notebooks":100,
 "wristbands":5000
};

let history=[];
let lastItem=null;

// SAVE
function saveAll(){
 localStorage.setItem("stock",JSON.stringify(stock));
 localStorage.setItem("history",JSON.stringify(history));
}

function loadAll(){
 let s=localStorage.getItem("stock");
 if(s) stock=JSON.parse(s);

 let h=localStorage.getItem("history");
 if(h) history=JSON.parse(h);
}

function msg(t,type){
 let d=document.createElement("div");
 d.className="msg "+type;
 d.innerText=t;
 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;
}

// SMART HELPERS
const WORD_NUM={"one":1,"two":2,"three":3,"four":4,"five":5,"six":6,"seven":7,"eight":8,"nine":9,"ten":10,"couple":2};
const ALIASES={"mug":"mugs","mugs":"mugs","stanley":"stanley","flask":"stanley","notebook":"notebooks","book":"notebooks","band":"wristbands"};

function normalize(t){return t.toLowerCase();}

function convertWords(t){
 for(let w in WORD_NUM){
  t=t.replace(new RegExp("\\b"+w+"\\b","g"),WORD_NUM[w]);
 }
 return t;
}

function extractNumber(t){
 let m=t.match(/(\d+\s*[\+\-]\s*\d+|\d+)/);
 if(!m) return 0;
 try{return eval(m[1]);}catch{return parseInt(m[1])||0;}
}

function findItem(t){
 for(let k in ALIASES){
  if(t.includes(k)) return ALIASES[k];
 }
 for(let i in stock){
  if(t.includes(i)) return i;
 }
 return lastItem;
}

// AI
function ask(){

 let input=q.value.trim();
 if(!input)return;

 q.value="";
 msg(input,"user");

 let t=normalize(input);
 t=convertWords(t);

 let qty=extractNumber(t);
 let item=findItem(t);

 let reply="";

 if(t.includes("hi")||t.includes("hello")||t.includes("morning")){
  reply="Hello 👋 I'm Br Bot. How can I help you?";
 }

 else if(t.includes("today")){
  reply="Today is "+new Date().toDateString();
 }

 else if(t.includes("sold")){
  if(item && qty){
   stock[item]-=qty;
   history.push({type:"sale",item,qty});
   lastItem=item;
   saveAll();
   reply=`✅ Sold ${qty} ${item}. Remaining: ${stock[item]}`;
  }else{
   reply="Try: sold 2 mugs";
  }
 }

 else if(t.includes("add")||t.includes("restock")){
  if(item && qty){
   stock[item]+=qty;
   history.push({type:"add",item,qty});
   lastItem=item;
   saveAll();
   reply=`📦 Added ${qty} ${item}. Total: ${stock[item]}`;
  }else{
   reply="Try: add 5 notebooks";
  }
 }

 else if(t.includes("report")){
  let total=0;
  history.forEach(h=>{if(h.type==="sale") total+=h.qty});
  reply=`📊 Total sold: ${total}`;
 }

 else if(t.includes("low")){
  let low=[];
  for(let i in stock){
   if(stock[i]<10) low.push(i);
  }
  reply=low.length?`⚠️ Low: ${low.join(", ")}`:"All stock ok";
 }

 else if(item){
  reply=`${item}: ${stock[item]} remaining`;
 }

 else{
  reply="Try: sold 2 mugs, add 5 notebooks, report";
 }

 setTimeout(()=>msg(reply,"bot"),300);
}

// INIT
window.onload=function(){
 loadWork();
 loadAll();
};

// SW
if('serviceWorker' in navigator){
 navigator.serviceWorker.register('sw.js');
}

</script>

</body>
</html>
