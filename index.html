<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Br Bot Smart System</title>

<style>
body{font-family:Arial;margin:0;background:#f5f5f5;}
header{background:#4208CC;color:#fff;padding:15px;text-align:center;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;}
.card{background:#fff;padding:20px;text-align:center;border-radius:10px;cursor:pointer;}
.section{display:none;padding:10px;}
.active{display:block;}
button{background:#FC8F00;border:none;padding:10px;color:#fff;border-radius:5px;margin:5px;}
input{padding:10px;width:90%;margin:5px;}
#chat{height:300px;overflow-y:auto;background:#fff;padding:10px;border-radius:10px;}
.msg{margin:5px;padding:8px;border-radius:10px;}
.user{background:#FC8F00;color:#fff;text-align:right;}
.bot{background:#eee;}
table{width:100%;border-collapse:collapse;margin-top:10px;}
td,th{border:1px solid #ccc;padding:6px;text-align:center;}
</style>

</head>

<body>

<header><h2>Br Bot Smart System</h2></header>

<!-- DASHBOARD -->

<div id="dashboard" class="active">
  <div class="grid">
    <div class="card" onclick="openSection('work')">📊 Work</div>
    <div class="card" onclick="openSection('ai')">🤖 Smart Bot</div>
  </div>
</div>

<!-- WORK -->

<div id="work" class="section">
  <select id="day">
    <option>Monday</option><option>Tuesday</option>
    <option>Wednesday</option><option>Thursday</option>
    <option>Friday</option><option>Saturday</option>
  </select>

<button onclick="addRow()">Add Job</button>

  <div id="tables"></div>
  <button onclick="goBack()">Back</button>
</div>

<!-- AI -->

<div id="ai" class="section">
  <div id="chat"></div>
  <input id="q" placeholder="Talk to Br Bot...">
  <button onclick="ask()">Send</button>
  <button onclick="goBack()">Back</button>
</div>

<script>

// NAV
function openSection(id){
 document.querySelectorAll('.section,#dashboard').forEach(e=>e.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}
function goBack(){
 document.querySelectorAll('.section').forEach(e=>e.classList.remove('active'));
 document.getElementById('dashboard').classList.add('active');
}

// WORK SYSTEM
function saveWork(){ localStorage.setItem("tables",tables.innerHTML); }
function loadWork(){ if(localStorage.tables){ tables.innerHTML=localStorage.tables; } }

function addRow(){
 let day=document.getElementById("day").value;

 if(!document.getElementById(day)){
  tables.innerHTML+=`
  <div id="${day}">
  <h4>${day}</h4>
  <table>
  <tr>
  <th>Job</th><th>Description</th><th>Price</th>
  <th>Paid</th><th>Balance</th><th>Unpaid</th>
  </tr>
  <tbody></tbody></table></div>`;
 }

 let t=document.querySelector(`#${day} tbody`);
 let r=document.createElement("tr");

 r.innerHTML=`
 <td contenteditable></td>
 <td contenteditable></td>
 <td contenteditable oninput="calc(this)"></td>
 <td contenteditable oninput="calc(this)"></td>
 <td></td><td></td>
 `;

 r.oninput=saveWork;
 t.appendChild(r);
}

function calc(c){
 let r=c.parentElement;
 let p=Number(r.cells[2].innerText)||0;
 let paid=Number(r.cells[3].innerText)||0;
 let bal=p-paid;
 r.cells[4].innerText=bal;
 r.cells[5].innerText=bal>0?bal:0;
 saveWork();
}

// STOCK
let stock={
 mugs:50,
 stanley:30,
 notebooks:100,
 wristbands:5000
};

let history=[];
let lastItem=null;

// STORAGE
function saveAll(){
 localStorage.setItem("stock",JSON.stringify(stock));
 localStorage.setItem("history",JSON.stringify(history));
}

function loadAll(){
 let s=localStorage.getItem("stock");
 if(s) stock=JSON.parse(s);

 let h=localStorage.getItem("history");
 if(h) history=JSON.parse(h);
}

// UI
function msg(t,type){
 let d=document.createElement("div");
 d.className="msg "+type;
 d.innerText=t;
 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;
}

// SMART AI ENGINE
function normalize(text){
 let t=text.toLowerCase();

 const numbers={
  one:1,two:2,three:3,four:4,five:5,
  six:6,seven:7,eight:8,nine:9,ten:10,
  couple:2
 };

 for(let n in numbers){
  t=t.replace(new RegExp("\\b"+n+"\\b","g"),numbers[n]);
 }

 return t;
}

function extractQty(t){
 let m=t.match(/\d+/);
 return m?parseInt(m[0]):null;
}

function findItem(t){
 for(let i in stock){
  if(t.includes(i) || t.includes(i.slice(0,-1))){
   return i;
  }
 }
 return lastItem;
}

// INTENT
function understand(input){

 let t=normalize(input);
 let qty=extractQty(t);
 let item=findItem(t);

 if(t.match(/hi|hello|hey|morning|evening/)) return {type:"greet"};
 if(t.match(/sell|sold|gave|removed/)) return {type:"sell",item,qty};
 if(t.match(/add|restock|bought|increase/)) return {type:"add",item,qty};
 if(t.match(/report|sales|summary/)) return {type:"report"};
 if(t.match(/low|running out|almost finished/)) return {type:"low"};
 if(t.match(/suggest|what.*restock|recommend/)) return {type:"suggest"};
 if(t.match(/top|best|most selling/)) return {type:"top"};
 if(item) return {type:"check",item};

 return {type:"unknown"};
}

// RESPONSE
function respond(intent){

 let {type,item,qty}=intent;

 if(type==="greet"){
  return "Hey 👋 I'm Br Bot! Ready to help you run your business 🚀";
 }

 if(type==="sell"){
  if(!item) return "Which item did you sell? 🤔";
  if(!qty) return `How many ${item} did you sell?`;

  stock[item]-=qty;
  history.push({type:"sale",item,qty});
  lastItem=item;
  saveAll();

  return `✅ Nice! You sold ${qty} ${item}. Remaining: ${stock[item]} 🎯`;
 }

 if(type==="add"){
  if(!item) return "Which item are you adding?";
  if(!qty) return `How many ${item} are you adding?`;

  stock[item]+=qty;
  history.push({type:"add",item,qty});
  lastItem=item;
  saveAll();

  return `📦 Great! Added ${qty} ${item}. Total now: ${stock[item]}`;
 }

 if(type==="report"){
  let total=history.filter(h=>h.type==="sale").reduce((a,b)=>a+b.qty,0);
  return `📊 So far you've sold ${total} items. Keep going 🚀`;
 }

 if(type==="low"){
  let low=Object.keys(stock).filter(i=>stock[i]<10);
  return low.length?`⚠️ You're low on: ${low.join(", ")}`:"👌 Stock levels look good";
 }

 if(type==="suggest"){
  let s=Object.entries(stock).sort((a,b)=>a[1]-b[1])[0];
  return `📦 You should restock ${s[0]} (only ${s[1]} left)`;
 }

 if(type==="top"){
  let count={};
  history.forEach(h=>{
   if(h.type==="sale"){
    count[h.item]=(count[h.item]||0)+h.qty;
   }
  });

  let top=Object.entries(count).sort((a,b)=>b[1]-a[1])[0];

  return top?`🔥 Best seller: ${top[0]} (${top[1]} sold)`:"No sales yet";
 }

 if(type==="check"){
  return `📦 You have ${stock[item]} ${item} remaining`;
 }

 return "Hmm 🤔 Try saying something like 'sold 2 mugs' or 'what should I restock'";
}

// MAIN
function ask(){

 let input=q.value.trim();
 if(!input)return;

 q.value="";
 msg(input,"user");

 let intent=understand(input);
 let reply=respond(intent);

 msg(reply,"bot");
}

// INIT
window.onload=function(){
 loadWork();
 loadAll();
 msg("👋 Hi! I'm Br Bot — your smart business assistant 🚀","bot");
};

</script>

</body>
</html>
