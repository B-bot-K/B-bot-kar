<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Br Bot Smart System</title>

<style>
body{font-family:Arial;margin:0;background:#f5f5f5;}
header{background:#4208CC;color:#fff;padding:15px;text-align:center;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;}
.card{background:#fff;padding:20px;text-align:center;border-radius:10px;cursor:pointer;}
.section{display:none;padding:10px;}
.active{display:block;}
button{background:#FC8F00;border:none;padding:10px;color:#fff;border-radius:5px;margin:5px;}
input{padding:10px;width:90%;margin:5px;}
#chat{height:300px;overflow-y:auto;background:#fff;padding:10px;border-radius:10px;}
.msg{margin:5px;padding:8px;border-radius:10px;}
.user{background:#FC8F00;color:#fff;text-align:right;}
.bot{background:#eee;}
</style>

</head>

<body>

<header><h2>Br Bot Smart System</h2></header>

<div id="dashboard" class="active">
  <div class="grid">
    <div class="card" onclick="openSection('ai')">🤖 Smart Bot</div>
  </div>
</div>

<div id="ai" class="section">
  <div id="chat"></div>
  <input id="q" placeholder="Talk to Br Bot...">
  <button onclick="ask()">Send</button>
</div>

<script>

// STOCK
let stock={
 mugs:50,
 stanley:30,
 notebooks:100,
 wristbands:5000
};

let history=[];
let lastItem=null;

// HELPERS
function msg(t,type){
 let d=document.createElement("div");
 d.className="msg "+type;
 d.innerText=t;
 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;
}

function openSection(id){
 document.getElementById("dashboard").style.display="none";
 document.getElementById(id).style.display="block";
}

// SMART BRAIN
function ask(){

 let input=q.value.trim();
 if(!input)return;

 q.value="";
 msg(input,"user");

 let t=input.toLowerCase();

 // convert words to numbers
 let words={one:1,two:2,three:3,four:4,five:5,ten:10};
 for(let w in words){
  t=t.replace(w,words[w]);
 }

 let qty=parseInt((t.match(/\d+/)||[0])[0]);
 let item=null;

 for(let i in stock){
  if(t.includes(i) || t.includes(i.slice(0,-1))){
    item=i;
  }
 }

 let reply="";

 // SELL
 if(t.includes("sold") || t.includes("i sold") || t.includes("we sold")){
  if(item && qty){
   stock[item]-=qty;
   history.push({type:"sale",item,qty});
   lastItem=item;
   reply=`✅ Sold ${qty} ${item}. Remaining: ${stock[item]}`;
  }else{
   reply="Tell me like: sold 2 mugs";
  }
 }

 // ADD STOCK
 else if(t.includes("add") || t.includes("restock") || t.includes("bought")){
  if(item && qty){
   stock[item]+=qty;
   history.push({type:"add",item,qty});
   lastItem=item;
   reply=`📦 Added ${qty} ${item}. Total: ${stock[item]}`;
  }
 }

 // REPORT
 else if(t.includes("report") || t.includes("sales")){
  let total=0;
  history.forEach(h=>{if(h.type==="sale") total+=h.qty});
  reply=`📊 Total items sold: ${total}`;
 }

 // LOW STOCK
 else if(t.includes("low") || t.includes("running out")){
  let low=[];
  for(let i in stock){
   if(stock[i]<10) low.push(i);
  }
  reply=low.length?`⚠️ Low stock: ${low.join(", ")}`:"Stock levels are okay";
 }

 // SUGGESTION AI
 else if(t.includes("what should i restock") || t.includes("suggest")){
  let sorted=Object.entries(stock).sort((a,b)=>a[1]-b[1]);
  reply=`📦 You should restock: ${sorted[0][0]} (only ${sorted[0][1]} left)`;
 }

 // TREND AI
 else if(t.includes("which is selling most") || t.includes("top product")){
  let count={};
  history.forEach(h=>{
   if(h.type==="sale"){
     count[h.item]=(count[h.item]||0)+h.qty;
   }
  });
  let top=Object.entries(count).sort((a,b)=>b[1]-a[1])[0];
  reply=top?`🔥 Best selling: ${top[0]} (${top[1]} sold)`:"No sales yet";
 }

 // CONTEXT MEMORY
 else if(t.includes("add") && lastItem){
  stock[lastItem]+=qty;
  reply=`📦 Added ${qty} ${lastItem}`;
 }

 // CHECK ITEM
 else if(item){
  reply=`${item}: ${stock[item]} remaining`;
 }

 // SMART FALLBACK
 else{
  reply="I understand sales, stock, reports and trends. Try: 'sold 2 mugs' or 'what should I restock'";
 }

 msg(reply,"bot");
}

// INIT
msg("👋 Hello! I'm your smart business assistant.","bot");

</script>

</body>
</html>
