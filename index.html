<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brandit Pro System</title>

<style>
body{font-family:Arial;margin:0;background:#f5f5f5;}
header{background:#4208CC;color:#fff;padding:15px;text-align:center;}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;}
.card{background:#fff;padding:20px;text-align:center;border-radius:10px;cursor:pointer;}

.section{display:none;padding:10px;}
.active{display:block;}

button{background:#FC8F00;border:none;padding:10px;color:#fff;border-radius:5px;margin:5px;}
input{padding:10px;width:90%;margin:5px;}

#chat{height:300px;overflow-y:auto;background:#fff;padding:10px;border-radius:10px;}
.msg{margin:5px;padding:8px;border-radius:10px;}
.user{background:#FC8F00;color:#fff;text-align:right;}
.bot{background:#eee;}

table{width:100%;border-collapse:collapse;margin-top:10px;}
td,th{border:1px solid #ccc;padding:5px;}
</style>
</head>

<body>

<header>
<h2>Brandit Pro System</h2>
<p>by KarlBot</p>
</header>

<div id="dashboard" class="active">
<div class="grid">
<div class="card" onclick="openSection('work')">📊 Work</div>
<div class="card" onclick="openSection('ai')">🤖 KarlBot</div>
</div>
</div>

<div id="work" class="section">
<select id="day">
<option>Monday</option><option>Tuesday</option>
<option>Wednesday</option><option>Thursday</option>
<option>Friday</option><option>Saturday</option>
</select>

<button onclick="addRow()">Add Row</button>
<div id="tables"></div>
<button onclick="goBack()">Back</button>
</div>

<div id="ai" class="section">
<div id="chat"></div>
<input id="q" placeholder="Ask anything...">
<button onclick="ask()">Send</button>
<button onclick="goBack()">Back</button>
</div>

<script>

// NAV
function openSection(id){
 document.querySelectorAll('.section,#dashboard').forEach(e=>e.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}
function goBack(){
 document.querySelectorAll('.section').forEach(e=>e.classList.remove('active'));
 document.getElementById('dashboard').classList.add('active');
}

// WORK TABLE
function save(){localStorage.setItem("tables",tables.innerHTML);}
function load(){if(localStorage.tables)tables.innerHTML=localStorage.tables;}

function addRow(){
 let day=document.getElementById("day").value;

 if(!document.getElementById(day)){
 tables.innerHTML+=`
 <div id="${day}">
 <h4>${day}</h4>
 <table>
 <tr><th>Job</th><th>Description</th><th>Price</th><th>Paid</th><th>Balance</th><th>Unpaid</th><th>Expense</th><th>Cost</th></tr>
 <tbody></tbody></table></div>`;
 }

 let t=document.querySelector(`#${day} tbody`);
 let r=document.createElement("tr");

 r.innerHTML=`
 <td contenteditable></td>
 <td contenteditable></td>
 <td contenteditable oninput="calc(this)"></td>
 <td contenteditable oninput="calc(this)"></td>
 <td></td><td></td>
 <td contenteditable></td>
 <td contenteditable></td>
 `;
 r.oninput=save;
 t.appendChild(r);
}

function calc(c){
 let r=c.parentElement;
 let p=Number(r.cells[2].innerText)||0;
 let paid=Number(r.cells[3].innerText)||0;
 r.cells[4].innerText=p-paid;
 r.cells[5].innerText=(p-paid)>0?(p-paid):0;
 save();
}

// STOCK
let stock = {
"magic mugs red":{qty:77,unit:"pcs"},
"stanley flasks large":{qty:60,unit:"pcs"},
"stanley flasks small":{qty:53,unit:"pcs"},
"antifall flasks black":{qty:22,unit:"pcs"},
"thermal flasks":{qty:10,unit:"pcs"},
"original stanley flasks":{qty:6,unit:"pcs"},
"slub glass":{qty:42,unit:"pcs"},
"glass tumblers":{qty:6,unit:"pcs"},

"notebooks various":{qty:120,unit:"pcs"},
"leaf notebooks":{qty:5,unit:"pcs"},
"decorative books":{qty:21,unit:"pcs"},

"tap tap pens":{qty:147,unit:"pcs"},
"bic pens":{qty:64,unit:"pcs"},
"baoke pens":{qty:20,unit:"pcs"},

"wristbands red":{qty:1125,unit:"tickets"},
"wristbands yellow":{qty:4025,unit:"tickets"},
"wristbands blue":{qty:46,unit:"sheets"},

"black caps":{qty:107,unit:"pcs"},
"white bags":{qty:50,unit:"pcs"}
};

// SAVE STOCK
function saveStock(){
 localStorage.setItem("stock", JSON.stringify(stock));
}

function loadStock(){
 let saved = localStorage.getItem("stock");
 if(saved){ stock = JSON.parse(saved); }
}

// CHAT
function msg(t,type){
 let d=document.createElement("div");
 d.className="msg "+type;
 d.innerText=t;
 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;
}

// SMART MATCH
function findItem(userText){
 for(let item in stock){
   let words=item.split(" ");
   let match=words.some(w=>userText.includes(w));
   if(match) return item;
 }
 return null;
}

// AI
function ask(){

 let input=q.value.trim();
 if(!input) return;

 q.value="";
 msg(input,"user");

 let lower=input.toLowerCase();
 let reply="";

 // SOLD
 if(lower.includes("sold")){

   let number=parseInt(lower.match(/\d+/));
   let item=findItem(lower);

   if(item){
     if(stock[item].qty>=number){
       stock[item].qty-=number;
       saveStock();
       reply=`✅ Sold ${number} ${item}. Remaining: ${stock[item].qty}`;
     }else{
       reply=`⚠️ Only ${stock[item].qty} left`;
     }
   }else{
     reply="Item not found";
   }
 }

 // ADD STOCK
 else if(lower.includes("add")||lower.includes("restock")){

   let number=parseInt(lower.match(/\d+/));
   let item=findItem(lower);

   if(item){
     stock[item].qty+=number;
     saveStock();
     reply=`📦 Added ${number} ${item}. Total: ${stock[item].qty}`;
   }else{
     reply="Item not found";
   }
 }

 // DATE
 else if(lower.includes("today")){
   let d=new Date();
   reply="Today is "+d.toDateString();
 }

 // SEARCH
 else{
   let item=findItem(lower);
   if(item){
     reply=`${item}: ${stock[item].qty} ${stock[item].unit}`;
   }else{
     reply="Try: sold 2 mugs, add 5 notebooks, today";
   }
 }

 setTimeout(()=>msg(reply,"bot"),300);
}

// INIT
window.onload=function(){
 load();
 loadStock();
}
</script>

</body>
</html>
